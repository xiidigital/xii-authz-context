[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xii-authz-context"
version = "0.1.0"
description = "Authorization context library - NO IAM, no authentication, no dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "XII Digital"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/xiidigital/xii-authz-context"
Repository = "https://github.com/xiidigital/xii-authz-context"

[tool.setuptools.packages.find]
where = ["."]
include = ["authz_context*"]
